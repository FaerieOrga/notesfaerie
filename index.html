<body>
  <div id="root"></div>

  <!-- Script pour injecter le bouton MémoNotes dans le header React -->
  <script>
    window.addEventListener('DOMContentLoaded', () => {
      const observer = new MutationObserver(() => {
        const header = document.querySelector('header');
        if (header && !document.querySelector('.btn-memonotes')) {
          const link = document.createElement('a');
          link.href = 'https://faerieorga.github.io/memonotes/';
          link.target = '_blank';
          link.rel = 'noopener noreferrer';
          link.className = 'btn-memonotes';
          link.innerHTML = '📖 MémoNotes';
          
          const h1 = header.querySelector('h1');
          if (h1) {
            h1.after(link);
          } else {
            header.appendChild(link);
          }
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });
    });
  </script>
</body>
