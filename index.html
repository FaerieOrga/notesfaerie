<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6B9EB0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />

<body>
  <div id="root"></div>

<style>
  .nf-barre { display: flex; gap: 6px; margin-top: 4px; }
  .nf-barre button { min-height: 36px; min-width: 40px; padding: 0 10px; }
  .nf-fait { color: var(--mute); text-decoration: line-through; }
  .fiche textarea {
    min-height: clamp(220px, 40dvh, 480px);
    resize: vertical;
  }
  @media (min-width: 700px) {
    .fiche { max-width: 900px; }
  }

  /* En-tête : titre sur sa propre ligne, boutons dessous */
header { flex-wrap: wrap; row-gap: 8px; }
header h1 { flex: 1 1 100%; }
.btn-memonotes { margin-left: 0; }
header .ghost { margin-left: auto; }

/* Onglets des sujets : tous visibles, sur plusieurs lignes */
.chips { flex-wrap: wrap; overflow-x: visible; gap: 8px; }

/* Cartes des notes : marge à gauche et à droite */
.liste { padding: 0 16px; border-top: 0; }

  /* Fond dégradé comme MémoTâches */
:root { --bg: #5E9AA5; }
html { background: #B5DADB; }
body { background: transparent; }
body::before {
  content: "";
  position: fixed;
  inset: 0;
  z-index: -1;
  background: linear-gradient(180deg, #5E9AA5 0%, #8DBCC3 45%, #C0E3E2 100%);
}

/* Lisibilité sur le bas, plus clair */
.vide { color: var(--ink); }
.liste li { box-shadow: 0 1px 4px rgba(27, 38, 32, 0.15); }

/* Bouton + : aligné sur le bord droit des notes (ordinateur) */
.fab { right: max(18px, calc((100vw - 720px) / 2 - 76px)); }

@media (max-width: 600px) {
  header { gap: 6px; }
  .btn-memonotes { padding: 4px 10px; font-size: 13px; }
    header .ghost { font-size: 13px; padding: 0 4px; min-height: 36px; }
}

.recherche { display: flex; gap: 8px; align-items: flex-start; }
.recherche input { flex: 1; min-width: 0; }
.recherche select { width: auto; max-width: 46%; margin-top: 6px; }
  
</style>
  
<script>
  window.addEventListener('load', function() {
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmt(s) {
      return s
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/__(.+?)__/g, '<u>$1</u>')
        .replace(/~~(.+?)~~/g, '<s>$1</s>')
        .replace(/\*([^*\s](?:[^*]*[^*\s])?)\*/g, '<i>$1</i>');
    }
    function rendreLigne(l) {
      var h = l.split(/(https?:\/\/[^\s"'<>]+)/).map(function(p, i) {
        return i % 2
          ? '<a href="' + esc(p) + '" target="_blank" rel="noopener noreferrer" class="link-auto">' + esc(p) + '</a>'
          : fmt(esc(p));
      }).join('');
      return l.indexOf('\u2611 ') === 0 ? '<span class="nf-fait">' + h + '</span>' : h;
    }
    function rendre(texte) {
      return texte.split('\n').map(rendreLigne).join('\n');
    }

    // --- Édition dans la fiche ---
    var setter = Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set;
    function majTexte(ta, nv, a, b) {
      setter.call(ta, nv);
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      ta.focus();
      ta.setSelectionRange(a, b);
    }
    function entourer(ta, m) {
      var a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
      majTexte(ta, v.slice(0, a) + m + v.slice(a, b) + m + v.slice(b), a + m.length, b + m.length);
    }
    function cases(ta) {
      var v = ta.value;
      var d = v.lastIndexOf('\n', ta.selectionStart - 1) + 1;
      var f = v.indexOf('\n', ta.selectionEnd);
      if (f < 0) f = v.length;
      var lignes = v.slice(d, f).split('\n');
      var etat = lignes[0].indexOf('\u2610 ') === 0 ? 1 : lignes[0].indexOf('\u2611 ') === 0 ? 2 : 0;
      var out = lignes.map(function(l) {
        var nu = l.replace(/^([\u2610\u2611]|-) /, '');
        return etat === 0 ? '\u2610 ' + nu : etat === 1 ? '\u2611 ' + nu : nu;
      }).join('\n');
      majTexte(ta, v.slice(0, d) + out + v.slice(f), d, d + out.length);
    }
    function entree(e) {
      if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
      var ta = e.target, v = ta.value, p = ta.selectionStart;
      if (p !== ta.selectionEnd) return;
      var d = v.lastIndexOf('\n', p - 1) + 1;
      var f = v.indexOf('\n', p);
      if (f < 0) f = v.length;
      var ligne = v.slice(d, f);
      if (!/^[\u2610\u2611] /.test(ligne)) return;
      e.preventDefault();
      if (/^[\u2610\u2611] ?$/.test(ligne)) {
        majTexte(ta, v.slice(0, d) + v.slice(f), d, d);
      } else {
        majTexte(ta, v.slice(0, p) + '\n\u2610 ' + v.slice(p), p + 3, p + 3);
      }
    }

function toucheCase(ta) {
  var v = ta.value, p = ta.selectionStart;
  if (p !== ta.selectionEnd) return;
  var d = v.lastIndexOf('\n', p - 1) + 1;
  if (p > d + 1 || !/^[\u2610\u2611] /.test(v.slice(d, d + 2))) return;
  var n = v.charAt(d) === '\u2610' ? '\u2611' : '\u2610';
  majTexte(ta, v.slice(0, d) + n + v.slice(d + 1), d + 2, d + 2);
}
    
    function barre() {
      document.querySelectorAll('.fiche textarea').forEach(function(ta) {
        var prev = ta.previousElementSibling;
        if (prev && prev.classList.contains('nf-barre')) return;
        var bar = document.createElement('div');
        bar.className = 'nf-barre';
        [['<b>G</b>', '**', 'Gras'], ['<i>I</i>', '*', 'Italique'],
         ['<u>S</u>', '__', 'Souligné'], ['<s>B</s>', '~~', 'Barré'],
         ['\u2610', null, 'Case à cocher']].forEach(function(d) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.title = d[2];
          btn.innerHTML = d[0];
          btn.addEventListener('mousedown', function(e) { e.preventDefault(); });
          btn.addEventListener('click', function() { d[1] ? entourer(ta, d[1]) : cases(ta); });
          bar.appendChild(btn);
        });
        ta.before(bar);
        ta.addEventListener('keydown', entree);
        ta.addEventListener('click', function() { toucheCase(ta); });
      });
    }

    var observer = new MutationObserver(function() {
           // 1. Boutons MémoTâches et MémoNotes dans le header
      var header = document.querySelector('header');
      if (header && !document.querySelector('.btn-memonotes')) {
        var ref = header.querySelector('h1');
        [
          ['📋 MémoTâches', 'https://faerieorga.github.io/memonotes/'],
          ['📝 MémoNotes', 'https://faerieorga.github.io/memonotes/#notes']
        ].forEach(function(l) {
          var a = document.createElement('a');
          a.href = l[1];
          a.className = 'btn-memonotes';
          a.innerHTML = l[0];
          if (ref) { ref.after(a); } else { header.appendChild(a); }
          ref = a;
        });
      }

      // 2. Mise en forme, cases et liens cliquables dans les descriptions
      document.querySelectorAll('.desc, .note').forEach(function(el) {
        var t = el.textContent;
        if (/[\u2610\u2611] /.test(t)) el.style.webkitLineClamp = '10';
        if (el.dataset.nfOut === t) return;
        var h = rendre(t);
        if (h === esc(t)) return;
        el.innerHTML = h;
        el.dataset.nfOut = el.textContent;
      });

      // 3. Boutons de mise en forme dans la fiche
      barre();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 4. Un clic sur un lien l'ouvre sans ouvrir la fiche de la note
    document.addEventListener('click', function(e) {
      var a = e.target.closest && e.target.closest('a.link-auto');
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      window.open(a.href, '_blank', 'noopener');
    }, true);
  });
</script>
</body>
</html>
