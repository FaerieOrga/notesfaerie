<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

  <title>Journal de bord</title>
  <script type="module" crossorigin src="./assets/index-BH16Lvmw.js?v=3"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BQHrtv2n.css?v=3">
</head>
<body>
  <div id="root"></div>

<style>
  .nf-barre { display: flex; gap: 6px; margin-top: 4px; }
  .nf-barre button { min-height: 36px; min-width: 40px; padding: 0 10px; }
</style>
<script>
  window.addEventListener('load', function() {
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }
    function fmt(s) {
      return s
        .replace(/\*\*(.+?)\*\*/g, '<b>$1</b>')
        .replace(/__(.+?)__/g, '<u>$1</u>')
        .replace(/~~(.+?)~~/g, '<s>$1</s>')
        .replace(/\*([^*\s](?:[^*]*[^*\s])?)\*/g, '<i>$1</i>');
    }
    function rendre(texte) {
      return texte.split(/(https?:\/\/[^\s"'<>]+)/).map(function(p, i) {
        return i % 2
          ? '<a href="' + esc(p) + '" target="_blank" rel="noopener noreferrer" class="link-auto">' + esc(p) + '</a>'
          : fmt(esc(p));
      }).join('');
    }
    function entourer(ta, m) {
      var a = ta.selectionStart, b = ta.selectionEnd, v = ta.value;
      var nv = v.slice(0, a) + m + v.slice(a, b) + m + v.slice(b);
      Object.getOwnPropertyDescriptor(HTMLTextAreaElement.prototype, 'value').set.call(ta, nv);
      ta.dispatchEvent(new Event('input', { bubbles: true }));
      ta.focus();
      ta.setSelectionRange(a + m.length, b + m.length);
    }
    function barre() {
      document.querySelectorAll('.fiche textarea').forEach(function(ta) {
        var prev = ta.previousElementSibling;
        if (prev && prev.classList.contains('nf-barre')) return;
        var bar = document.createElement('div');
        bar.className = 'nf-barre';
        [['<b>G</b>', '**', 'Gras'], ['<i>I</i>', '*', 'Italique'],
         ['<u>S</u>', '__', 'Souligné'], ['<s>B</s>', '~~', 'Barré']].forEach(function(d) {
          var btn = document.createElement('button');
          btn.type = 'button';
          btn.title = d[2];
          btn.innerHTML = d[0];
          btn.addEventListener('mousedown', function(e) { e.preventDefault(); });
          btn.addEventListener('click', function() { entourer(ta, d[1]); });
          bar.appendChild(btn);
        });
        ta.before(bar);
      });
    }

    var observer = new MutationObserver(function() {
      // 1. Bouton MémoTâches dans le header
      var header = document.querySelector('header');
      if (header && !document.querySelector('.btn-memonotes')) {
        var link = document.createElement('a');
        link.href = 'https://faerieorga.github.io/memonotes/';
        link.className = 'btn-memonotes';
        link.innerHTML = '📋 MémoTâches';
        var h1 = header.querySelector('h1');
        if (h1) { h1.after(link); } else { header.appendChild(link); }
      }

      // 2. Mise en forme + liens cliquables dans les descriptions
      document.querySelectorAll('.desc, .note').forEach(function(el) {
        var t = el.textContent;
        if (el.dataset.nfOut === t) return;
        var h = rendre(t);
        if (h === esc(t)) return;
        el.innerHTML = h;
        el.dataset.nfOut = el.textContent;
      });

      // 3. Boutons de mise en forme dans la fiche
      barre();
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 4. Un clic sur un lien l'ouvre sans ouvrir la fiche de la note
    document.addEventListener('click', function(e) {
      var a = e.target.closest && e.target.closest('a.link-auto');
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      window.open(a.href, '_blank', 'noopener');
    }, true);
  });
</script>
</body>
</html>
