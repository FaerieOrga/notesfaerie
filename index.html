<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#6B9EB0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&display=swap" rel="stylesheet" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <title>NotesFaérie</title>
  <script type="module" crossorigin src="./assets/index-BH16Lvmw.js?v=3"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-BQHrtv2n.css?v=3">
</head>
<body>
  <div id="root"></div>

<script>
  window.addEventListener('load', function() {
    function esc(s) {
      return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    var observer = new MutationObserver(function() {
      // 1. Bouton MémoTâches dans le header
      var header = document.querySelector('header');
      if (header && !document.querySelector('.btn-memonotes')) {
        var link = document.createElement('a');
        link.href = 'https://faerieorga.github.io/memonotes/';
        link.className = 'btn-memonotes';
        link.innerHTML = '📋 MémoTâches';
        var h1 = header.querySelector('h1');
        if (h1) { h1.after(link); } else { header.appendChild(link); }
      }

      // 2. Liens cliquables dans les descriptions (une seule fois par élément)
      document.querySelectorAll('.desc, .note').forEach(function(el) {
        if (el.querySelector('a.link-auto')) return;
        var texte = el.textContent;
        if (!/https?:\/\//.test(texte)) return;
        var parts = texte.split(/(https?:\/\/[^\s"'<>]+)/);
        el.innerHTML = parts.map(function(p, i) {
          return i % 2
            ? '<a href="' + esc(p) + '" target="_blank" rel="noopener noreferrer" class="link-auto">' + esc(p) + '</a>'
            : esc(p);
        }).join('');
      });
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Un clic sur un lien l'ouvre sans ouvrir la fiche de la note
    document.addEventListener('click', function(e) {
      var a = e.target.closest && e.target.closest('a.link-auto');
      if (!a) return;
      e.preventDefault();
      e.stopPropagation();
      window.open(a.href, '_blank', 'noopener');
    }, true);
  });
</script>
</body>
</html>
